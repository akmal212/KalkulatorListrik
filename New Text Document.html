<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kalkulator Listrik Pintar</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #eef2f7, #dfe9f3);
    margin: 0;
    padding: 0;
    text-align: center;
}

.container {
    width: 350px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    animation: fadeIn 0.5s ease;
}

h2, h3 {
    margin-bottom: 15px;
}

button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

.blue { background: #3498db; color: white; }
.green { background: #2ecc71; color: white; }
.gray { background: #95a5a6; color: white; }

input {
    width: 90%;
    padding: 8px;
    margin: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.hidden { display: none; }

.result {
    margin-top: 15px;
    padding: 10px;
    background: #f1f8ff;
    border-radius: 10px;
    animation: fadeIn 0.5s;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}

.alat-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.alat-row input {
    width: 30%;
}
</style>
</head>

<body>

<!-- HOME -->
<div class="container" id="home">
    <h2>⚡ Kalkulator Listrik</h2>
    <button class="blue" onclick="showMode1()">Cek Pemakaian Saya</button>
    <button class="green" onclick="showMode2()">Simulasi Peralatan</button>
</div>

<!-- MODE 1 -->
<div class="container hidden" id="mode1">
    <h3>🔵 Mode Token</h3>
    <input type="number" id="token1" placeholder="Token Awal (kWh)">
    <input type="date" id="date1">
    <input type="number" id="token2" placeholder="Token Akhir (kWh)">
    <input type="date" id="date2">

    <button class="blue" onclick="hitungMode1()">Hitung</button>
    <button class="gray" onclick="back()">Kembali</button>

    <div id="hasil1" class="result"></div>
</div>

<!-- MODE 2 -->
<div class="container hidden" id="mode2">
    <h3>🟢 Simulasi Alat</h3>

    <div id="alatContainer"></div>

    <button class="green" onclick="tambahAlat()">+ Tambah Peralatan</button>
    <button class="blue" onclick="hitungMode2()">Hitung</button>
    <button class="gray" onclick="back()">Kembali</button>

    <div id="hasil2" class="result"></div>
</div>

<script>
function hideAll(){
    document.getElementById("home").classList.add("hidden");
    document.getElementById("mode1").classList.add("hidden");
    document.getElementById("mode2").classList.add("hidden");
}

function showMode1(){
    hideAll();
    document.getElementById("mode1").classList.remove("hidden");
}

function showMode2(){
    hideAll();
    document.getElementById("mode2").classList.remove("hidden");
}

function back(){
    hideAll();
    document.getElementById("home").classList.remove("hidden");
}

// MODE 1
function hitungMode1(){
    let t1 = parseFloat(token1.value);
    let t2 = parseFloat(token2.value);

    let d1 = new Date(date1.value);
    let d2 = new Date(date2.value);

    let hari = (d2 - d1) / (1000*60*60*24);
    let konsumsi = (t1 - t2) / hari;

    let biaya = konsumsi * 30 * 1444;

    hasil1.innerHTML = `
        ⚡ <b>${konsumsi.toFixed(2)} kWh/hari</b><br>
        💰 Rp ${Math.round(biaya)}/bulan
    `;
}

// MODE 2
let alatContainer = document.getElementById("alatContainer");

function tambahAlat(){
    let div = document.createElement("div");
    div.classList.add("alat-row");

    div.innerHTML = `
        <input type="text" placeholder="Nama">
        <input type="number" placeholder="Watt">
        <input type="number" placeholder="Jam">
    `;

    alatContainer.appendChild(div);
}

// default alat
tambahAlat();
tambahAlat();

function hitungMode2(){
    let rows = document.querySelectorAll(".alat-row");
    let total = 0;

    rows.forEach(row => {
        let watt = row.children[1].value;
        let jam = row.children[2].value;

        if(watt && jam){
            total += (watt * jam)/1000;
        }
    });

    let biaya = total * 1444;

    hasil2.innerHTML = `
        ⚡ <b>${total.toFixed(2)} kWh/hari</b><br>
        💰 Rp ${Math.round(biaya)}/hari<br>
        📅 Rp ${Math.round(biaya*30)}/bulan
    `;
}
</script>

</body>
</html>
